name: Build HLCamSwap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils libplist-utils libssl-dev clang llvm lld
          echo "--- 检查工具 ---"
          ls -la /usr/bin/ld64.lld* 2>/dev/null || echo "ld64.lld not in /usr/bin"
          ls -la /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null || echo "not in llvm dir"

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C /tmp
          cp -r /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks/

      - name: Link toolchain
        run: |
          TD=$THEOS/toolchain/linux/iphone/bin
          mkdir -p $TD
          ln -sf $(which clang)    $TD/clang
          ln -sf $(which clang++)  $TD/clang++
          ln -sf $(which ar)       $TD/ar
          ln -sf $(which ranlib)   $TD/ranlib
          ln -sf $(which strip)    $TD/strip
          ln -sf $(which nm)       $TD/nm
          ln -sf $(which objcopy)  $TD/objcopy 2>/dev/null || true
          # 关键：用 ld64.lld 而不是 GNU ld
          LD64=$(which ld64.lld 2>/dev/null || find /usr -name "ld64.lld" 2>/dev/null | head -1)
          echo "找到 ld64.lld: $LD64"
          if [ -n "$LD64" ]; then
            ln -sf "$LD64" $TD/ld
            ln -sf "$LD64" $TD/ld64
            echo "已链接 ld64.lld"
          else
            echo "!! ld64.lld 未找到，尝试用 lld"
            ln -sf $(which lld) $TD/ld
          fi
          ls -la $TD/

      - name: ldid
        run: |
          curl -L "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Build
        run: |
          cd HLCamSwap
          make clean || true
          make package FINALPACKAGE=1 2>&1 | tail -60
        env:
          THEOS: ${{ env.THEOS }}

      - name: Collect
        run: |
          mkdir -p out
          find . -name "*.deb" -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: HLCamSwap-deb
          path: out/*.deb
