name: Build HLCamSwap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          brew install ldid || true
          which ldid || echo "ldid not found, theos has bundled"

      - name: Build & Package
        run: |
          cd HLCamSwap
          make clean || true
          echo "=== make ==="
          make 2>&1 | tee /tmp/build.log | tail -50
          echo "=== dylib ==="
          find . -name "*.dylib" 2>/dev/null
          echo "=== package ==="
          make package FINALPACKAGE=1 2>&1 | tee /tmp/pkg.log | tail -30
          echo "=== packages ==="
          ls -la packages/ 2>/dev/null || echo "no packages"

      - name: Collect
        run: |
          mkdir -p out
          find . -name "*.deb" -exec cp -v {} out/ \; 2>/dev/null || true
          cp /tmp/build.log /tmp/pkg.log out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-deb
          path: out/
          if-no-files-found: warn
