name: Build HLCamSwap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils libplist-utils libssl-dev clang llvm lld dpkg fakeroot
          echo "=== dpkg-deb ==="
          dpkg-deb --version | head -1
          echo "=== fakeroot ==="
          fakeroot --version | head -1

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C /tmp
          cp -r /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks/

      - name: Link toolchain
        run: |
          TD=$THEOS/toolchain/linux/iphone/bin
          mkdir -p $TD
          ln -sf $(which clang)    $TD/clang
          ln -sf $(which clang++)  $TD/clang++
          ln -sf $(which ar)       $TD/ar
          ln -sf $(which ranlib)   $TD/ranlib
          ln -sf $(which strip)    $TD/strip
          LD64=$(which ld64.lld 2>/dev/null || find /usr -name "ld64.lld" 2>/dev/null | head -1)
          [ -n "$LD64" ] && ln -sf "$LD64" $TD/ld && echo "ld64.lld linked"
          ls -la $TD/

      - name: ldid
        run: |
          curl -L "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -v 2>&1 | head -2 || true

      - name: Build tweak
        run: |
          cd HLCamSwap
          echo "=== make clean ==="
          make clean 2>&1 || true
          echo "=== make (compile) ==="
          make 2>&1 | tail -30
          echo "=== 编译产物 ==="
          find . -name "*.dylib" -o -name "*.o" | head -10

      - name: Package deb
        run: |
          cd HLCamSwap
          echo "=== make package ==="
          make package FINALPACKAGE=1 2>&1 | tail -40
          echo "=== 查找 deb ==="
          ls -la packages/ 2>/dev/null || echo "no packages dir"
          find / -name "*.deb" -newer /tmp -not -path "*/apt/*" 2>/dev/null | head -10

      - name: Collect
        run: |
          mkdir -p out
          find . -name "*.deb" -exec cp -v {} out/ \;
          echo "=== out 目录 ==="
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: HLCamSwap-deb
          path: out/
          if-no-files-found: warn
