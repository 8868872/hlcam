name: Build HLCamSwap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils libplist-utils libssl-dev dpkg fakeroot clang llvm lld

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Toolchain setup
        run: |
          TD=$THEOS/toolchain/linux/iphone/bin
          mkdir -p $TD
          # 用系统 clang，但通过 -B 让它去 $TD 找链接器
          ln -sf $(which clang)    $TD/clang
          ln -sf $(which clang++)  $TD/clang++
          ln -sf $(which ar)       $TD/ar
          ln -sf $(which ranlib)   $TD/ranlib
          ln -sf $(which strip)    $TD/strip
          ln -sf $(which nm)       $TD/nm
          # 关键：ld 必须指向 ld64.lld（Mach-O 链接器）
          LD64=$(find /usr -name "ld64.lld*" -type f 2>/dev/null | head -1)
          echo "找到 ld64.lld: $LD64"
          if [ -z "$LD64" ]; then
            echo "!! 系统没有 ld64.lld，尝试安装 lld-14"
            sudo apt-get install -y lld-14 || true
            LD64=$(find /usr -name "ld64.lld*" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$LD64" ]; then
            ln -sf "$LD64" $TD/ld
            ln -sf "$LD64" $TD/ld64
            echo "✓ ld 已指向 ld64.lld"
            $LD64 --version 2>&1 | head -3 || true
          else
            echo "!! ld64.lld 仍然找不到"
          fi
          echo "=== toolchain 目录 ==="
          ls -la $TD/
          echo "=== ld 解析 ==="
          readlink -f $TD/ld 2>/dev/null || echo "unresolved"

      - name: iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C /tmp
          cp -r /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks/

      - name: ldid
        run: |
          curl -L "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Build
        run: |
          cd HLCamSwap
          TD=$THEOS/toolchain/linux/iphone/bin
          make clean || true
          echo "=== make (with -B toolchain dir) ==="
          # -B 让 clang 从 $TD 找 ld
          make CC="$TD/clang -B$TD" 2>&1 | tee /tmp/build.log | tail -40
          echo "=== dylib ==="
          find . -name "*.dylib" 2>/dev/null
          echo "=== package ==="
          make package FINALPACKAGE=1 CC="$TD/clang -B$TD" 2>&1 | tee /tmp/pkg.log | tail -30
          echo "=== packages ==="
          ls -la packages/ 2>/dev/null || echo "no packages"

      - name: Collect
        run: |
          mkdir -p out
          find . -name "*.deb" -exec cp -v {} out/ \; 2>/dev/null || true
          cp /tmp/build.log /tmp/pkg.log out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: out/
          if-no-files-found: warn
